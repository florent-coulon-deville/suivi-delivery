# Thème « suivi-delivery » des pages de connexion de Keycloak : elles ont l'allure de l'outil
# (mêmes couleurs, même barre du haut, même carte de connexion), pour qu'on ne voie pas qu'on
# passe par Keycloak. Guide : docs/keycloak.md.
#
# Parent « base » : les pages de Keycloak sans aucune mise en forme, que nous habillons nous-mêmes
# (template.ftl : le cadre commun ; resources/css/suivi-delivery.css : les couleurs de
# frontend/app/styles.css, écrites dans chaque page). login.ftl et login-update-password.ftl sont réécrites à l'identique
# de l'outil ; les autres pages (erreur, page expirée…) gardent celles de « base », dans notre cadre.
parent=base
import=common/keycloak
locales=fr

# Les couleurs : resources/css/suivi-delivery.css, écrit dans chaque page par template.ftl.

# Bandeau du nom de l'instance, comme dans l'interface : mêmes variables (INSTANCE_NAME,
# INSTANCE_COLOR), lues au démarrage de Keycloak. Vide : pas de bandeau.
instanceName=${env.INSTANCE_NAME:}
instanceColor=${env.INSTANCE_COLOR:}

# Classes CSS données aux éléments des pages de « base » : celles de l'interface.
kcHtmlClass=
kcBodyClass=
kcLoginClass=
kcFormCardClass=
kcFormClass=form
kcFormGroupClass=field
kcLabelWrapperClass=
kcLabelClass=
kcInputWrapperClass=
kcInputClass=
kcInputGroup=input-group
kcInputErrorMessageClass=field-error
kcFormButtonsClass=form-buttons
kcFormOptionsClass=
kcFormOptionsWrapperClass=
kcFormSettingClass=
kcButtonClass=button
kcButtonPrimaryClass=button-primary
kcButtonDefaultClass=button-secondary
kcButtonBlockClass=button-large
kcButtonLargeClass=
kcAlertClass=banner
kcAlertTitleClass=
kcFormPasswordVisibilityButtonClass=button-show
kcFormPasswordVisibilityIconShow=icon-show
kcFormPasswordVisibilityIconHide=icon-hide
kcSignUpClass=
kcInfoAreaWrapperClass=
