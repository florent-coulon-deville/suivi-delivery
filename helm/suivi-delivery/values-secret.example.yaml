# Modèle des SECRETS d'une installation. À copier en « values-secret.yaml », puis à remplir.
#
#   cp helm/suivi-delivery/values-secret.example.yaml helm/suivi-delivery/values-secret.yaml
#   helm upgrade --install suivi-delivery ./helm/suivi-delivery -f helm/suivi-delivery/values-secret.yaml
#
# values-secret.yaml n'est JAMAIS publié : il est ignoré par Git (.gitignore) et par Helm
# (.helmignore). Ne jamais passer ces valeurs en « --set » : elles resteraient dans
# l'historique du terminal. Tout est facultatif : une valeur absente ou vide est ignorée.

# Accès au registre des images, pour que le cluster puisse les télécharger. Le chart en fait un
# Secret « dockerconfigjson », utilisé par les pods. Inutile sur kind (images chargées
# directement), ou si l'équipe OpenShift fournit déjà ce Secret (voir « registry.existingSecret »
# dans values.yaml).
registry:
  server: ""        # ex. ghcr.io (GitHub), ou registry.example.com
  user: ""    # ghcr.io : le compte GitHub ; ailleurs, de préférence un compte « robot » en lecture seule
  password: ""     # un jeton, jamais un vrai mot de passe. ghcr.io : jeton personnel GitHub avec le seul droit read:packages

# Secrets de l'application. Absents : générés à la première installation, puis conservés
# (lus avec : kubectl get secret <installation>-application -o jsonpath='{.data.APP_ADMIN_PASSWORD}' | base64 -d).
application:
  adminPassword: ""    # APP_ADMIN_PASSWORD : mot de passe INITIAL du compte admin, 12 caractères au moins
                         # (importé une fois dans Keycloak ; le changer ensuite dans « Mon compte »)
  keycloakClientSecret: ""  # APP_KEYCLOAK_CLIENT_SECRET : 16 caractères au moins (ex. openssl rand -hex 24)

# Mots de passe dans la base. Base intégrée (database.internal) : absents, ils sont générés à la première
# installation, puis conservés. Base fournie : OBLIGATOIRES (donnés par l'équipe des bases de données).
database:
  password: ""           # APP_DB_PASSWORD : l'utilisateur de nos tables (Liquibase, API)
  keycloakPassword: ""   # KC_DB_PASSWORD : l'utilisateur de Keycloak

# Administrateur provisoire de Keycloak (sa console, par port-forward seulement, docs/keycloak.md).
keycloak:
  adminPassword: ""      # KC_BOOTSTRAP_ADMIN_PASSWORD
