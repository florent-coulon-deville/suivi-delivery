# Modèle des SECRETS d'une installation. À copier en « values-secret.yaml », puis à remplir.
#
#   cp helm/suivi-delivery/values-secret.example.yaml helm/suivi-delivery/values-secret.yaml
#   helm upgrade --install suivi-delivery ./helm/suivi-delivery -f helm/suivi-delivery/values-secret.yaml
#
# values-secret.yaml n'est JAMAIS publié : il est ignoré par Git (.gitignore) et par Helm
# (.helmignore). Ne jamais passer ces valeurs en « --set » : elles resteraient dans
# l'historique du terminal. Tout est facultatif : une valeur absente ou vide est ignorée.

# Accès à un registre d'images PRIVÉ, pour que le cluster puisse les télécharger. Le chart en fait
# un Secret « dockerconfigjson », utilisé par les pods. À laisser vide pour ghcr.io (images
# publiques, téléchargées sans connexion), sur kind (images chargées directement), ou si l'équipe
# OpenShift fournit déjà ce Secret (voir « registry.existingSecret » dans values.yaml).
registry:
  server: ""        # ex. registry.example.com (vide : pas de connexion)
  user: ""          # de préférence un compte « robot » en lecture seule
  password: ""      # un jeton, jamais un vrai mot de passe
