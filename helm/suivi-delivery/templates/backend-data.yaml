{{- /*
Le disque des données de l'API (fichier SQLite). « helm.sh/resource-policy: keep » : jamais supprimé
par « helm uninstall », pour ne pas perdre les données (le supprimer à la main pour repartir de zéro :
kubectl delete pvc <installation>-data).
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sd.name" . }}-data
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.backend.storage.className }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
