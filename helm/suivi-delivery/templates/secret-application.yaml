{{- /*
Secret de l'application :
  APP_ADMIN_PASSWORD           mot de passe initial du compte « admin » de l'outil, importé dans
                               Keycloak à son premier démarrage (le changer ensuite : Mon compte) ;
  APP_DB_PASSWORD              mot de passe de la base (Liquibase et l'API) ;
  APP_KEYCLOAK_CLIENT_SECRET   clé du client « suivi-delivery-api » dans Keycloak (gestion des comptes),
                               importée dans Keycloak et lue par l'API ;
  KC_DB_PASSWORD               mot de passe de l'utilisateur de Keycloak dans la base ;
  KC_BOOTSTRAP_ADMIN_PASSWORD  administrateur provisoire de Keycloak (console, port-forward seulement).

  - fournis dans values-secret.yaml (« application », « base », « keycloak ») : ils sont utilisés ;
  - sinon, s'il existe déjà (installation précédente) : il est conservé tel quel ;
  - sinon : générés au hasard à la première installation. Sauf les mots de passe d'une base
    fournie (database.internal: false), qu'on ne peut pas inventer : ils sont alors obligatoires.

« helm.sh/resource-policy: keep » : jamais supprimé par « helm uninstall », pour ne pas perdre
l'accès à la base. Non créé si « application.existingSecret » est fourni.
*/ -}}
{{- if not .Values.application.existingSecret }}
{{- $name := include "sd.applicationSecret" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $password := .Values.application.adminPassword }}
{{- $key := .Values.application.keycloakClientSecret }}
{{- $databasePassword := (.Values.database).password }}
{{- $keycloakPassword := (.Values.database).keycloakPassword }}
{{- $keycloakAdmin := (.Values.keycloak).adminPassword }}
{{- if not (or $databasePassword (get $existing "APP_DB_PASSWORD") .Values.database.internal) }}
{{- fail "database.password est obligatoire avec une base fournie (database.internal: false) : le mettre dans values-secret.yaml" }}
{{- end }}
{{- if not (or $keycloakPassword (get $existing "KC_DB_PASSWORD") .Values.database.internal) }}
{{- fail "database.keycloakPassword est obligatoire avec une base fournie (database.internal: false) : le mettre dans values-secret.yaml" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  APP_ADMIN_PASSWORD: {{ if $password }}{{ $password | b64enc }}{{ else }}{{ get $existing "APP_ADMIN_PASSWORD" | default (randAlphaNum 20 | b64enc) }}{{ end }}
  APP_DB_PASSWORD: {{ if $databasePassword }}{{ $databasePassword | b64enc }}{{ else }}{{ get $existing "APP_DB_PASSWORD" | default (randAlphaNum 32 | b64enc) }}{{ end }}
  APP_KEYCLOAK_CLIENT_SECRET: {{ if $key }}{{ $key | b64enc }}{{ else }}{{ get $existing "APP_KEYCLOAK_CLIENT_SECRET" | default (randAlphaNum 48 | b64enc) }}{{ end }}
  KC_DB_PASSWORD: {{ if $keycloakPassword }}{{ $keycloakPassword | b64enc }}{{ else }}{{ get $existing "KC_DB_PASSWORD" | default (randAlphaNum 32 | b64enc) }}{{ end }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ if $keycloakAdmin }}{{ $keycloakAdmin | b64enc }}{{ else }}{{ get $existing "KC_BOOTSTRAP_ADMIN_PASSWORD" | default (randAlphaNum 32 | b64enc) }}{{ end }}
{{- end }}
