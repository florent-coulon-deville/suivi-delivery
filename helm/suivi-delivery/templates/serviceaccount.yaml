{{- /*
Compte de service des pods. L'application n'a pas besoin de parler à l'API de Kubernetes :
aucun droit (pas de RBAC), et aucun jeton monté dans les pods.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sd.name" . }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
automountServiceAccountToken: false
