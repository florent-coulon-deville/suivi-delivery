{{- /*
Seuls les pods portant l'étiquette « suivi-delivery/api-access » de cette installation
(l'interface, et le test Helm) peuvent joindre l'API. Les probes de Kubernetes, envoyées par
le nœud, ne sont pas concernées.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sd.name" . }}-backend
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "sd.selector" (dict "context" . "part" "backend") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              suivi-delivery/api-access: "true"
      ports:
        - port: http
{{- end }}
