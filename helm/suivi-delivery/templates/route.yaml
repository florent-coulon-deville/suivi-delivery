{{- /*
OpenShift : adresse publique de l'interface, en HTTPS (certificat du routeur OpenShift ; le
HTTP est redirigé vers le HTTPS). Créée seulement si le cluster est un OpenShift : ailleurs
(kind…), elle est simplement ignorée. L'API n'a jamais de Route.
*/ -}}
{{- if and .Values.route.enabled (.Capabilities.APIVersions.Has "route.openshift.io/v1/Route") }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "sd.name" . }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  {{- with .Values.route.host }}
  host: {{ . }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "sd.name" . }}-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
