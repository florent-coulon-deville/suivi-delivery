{{- /* Adresse interne de l'API, utilisée par l'interface (API_URL). Jamais exposée à l'extérieur. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sd.name" . }}-backend
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    {{- include "sd.selector" (dict "context" . "part" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
