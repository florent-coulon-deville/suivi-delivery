{{- /*
Secret d'accès au registre des images (type « dockerconfigjson »), créé à partir de
values-secret.yaml (« registre »). Les pods s'en servent pour télécharger les images.
Non créé si « registry.existingSecret » est fourni, ni si aucune adresse n'est donnée (kind).
*/ -}}
{{- if and .Values.registry.server (not .Values.registry.existingSecret) }}
{{- $user := required "registry.user est obligatoire avec registry.server (values-secret.yaml)" .Values.registry.user }}
{{- $password := required "registry.password est obligatoire avec registry.server (values-secret.yaml)" .Values.registry.password }}
{{- $auth := dict "username" $user "password" $password "auth" (printf "%s:%s" $user $password | b64enc) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sd.registrySecret" . }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.registry.server $auth) | toJson | b64enc }}
{{- end }}
