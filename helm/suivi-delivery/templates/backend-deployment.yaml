{{- /*
L'API (backend) : un seul exemplaire au plus (backend.replicas : 0 ou 1). Ses données sont dans un
fichier SQLite (APP_DB_FILE), sur le disque du PersistentVolumeClaim « <installation>-data », monté
sur /data. L'API crée elle-même ses tables au premier démarrage.

« Recreate » : à une mise à jour, l'ancien pod s'arrête AVANT que le nouveau démarre. Deux API ne
travaillent donc jamais en même temps sur le même fichier (et le disque, attaché à un seul nœud à
la fois, est libéré pour le nouveau pod).
Probes : voir docs/deploiement.md § 8.
*/ -}}
{{- $part := dict "context" . "part" "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sd.name" . }}-backend
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sd.selector" $part | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sd.labels" . | nindent 8 }}
        {{- include "sd.selector" $part | nindent 8 }}
    spec:
      serviceAccountName: {{ include "sd.name" . }}
      automountServiceAccountToken: false
      {{- include "sd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Le disque des données appartient au groupe 0 : l'utilisateur du conteneur (au hasard sur
        # OpenShift, 1001 ailleurs) peut y écrire.
        fsGroup: 0
      containers:
        - name: backend
          image: {{ include "sd.image" $part }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - { name: APP_HOST, value: "0.0.0.0" }
            - { name: APP_PORT, value: "8000" }
            - { name: APP_DB_FILE, value: /data/suivi-delivery.sqlite }
            - { name: APP_LOG_LEVEL, value: {{ .Values.application.logLevel | quote }} }
            - { name: APP_DOCS, value: {{ ternary "oui" "non" .Values.application.swagger | quote }} }
          startupProbe:
            httpGet: { path: /startupz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          {{- include "sd.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "sd.name" . }}-data
        - name: tmp
          emptyDir: {}
