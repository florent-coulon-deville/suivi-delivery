{{- /*
Base PostgreSQL intégrée (database.internal: true) : image du projet (PostgreSQL durci), UN exemplaire, ses données sur
un disque (PersistentVolumeClaim) conservé même après « helm uninstall ».

Un StatefulSet plutôt qu'un Deployment : c'est l'objet Kubernetes prévu pour une application qui
garde des données. Son disque lui est attaché pour toujours, et il ne lance jamais deux pods en
même temps sur ce disque.

Le disque est monté sur /var/lib/postgresql : PostgreSQL 18 range ses fichiers dans un
sous-dossier par version (18/data).

Au premier démarrage (disque vide), l'image du projet prépare la base : le schéma de nos tables
(database.schema), puis l'utilisateur et le schéma de Keycloak (postgres/initialization/01-schemas.sh).

Utilisateur : sur OpenShift, un utilisateur au hasard (l'image le déclare elle-même au démarrage,
dans /tmp/passwd : voir postgres/start.sh) ; ailleurs (kind…), l'utilisateur « postgres » de
l'image (70), qui n'est pas root.
*/ -}}
{{- if .Values.database.internal }}
{{- $part := dict "context" . "part" "postgresql" }}
{{- $name := printf "%s-postgresql" (include "sd.name" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  selector:
    {{- include "sd.selector" $part | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "sd.selector" $part | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sd.labels" . | nindent 8 }}
        {{- include "sd.selector" $part | nindent 8 }}
      annotations:
        # Un mot de passe changé dans values-secret.yaml redémarre la base.
        suivi-delivery/secrets-checksum: {{ printf "%s%s" ((.Values.database).password | default "") ((.Values.database).keycloakPassword | default "") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "sd.name" . }}
      automountServiceAccountToken: false
      {{- include "sd.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        {{- with include "sd.postgresUser" . }}
        {{- . | nindent 8 }}
        fsGroup: 70
        {{- end }}
      containers:
        - name: postgresql
          image: {{ include "sd.image" $part }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            # Au tout premier démarrage (disque vide), l'image crée la base et son utilisateur, puis
            # le schéma de nos tables, et l'utilisateur et le schéma de Keycloak.
            - { name: POSTGRES_DB, value: {{ .Values.database.name | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.database.user | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "sd.applicationSecret" . }}, key: APP_DB_PASSWORD }
            - { name: APP_DB_SCHEMA, value: {{ .Values.database.schema | quote }} }
            - { name: KC_DB_USERNAME, value: {{ .Values.database.keycloakUser | quote }} }
            - { name: KC_DB_SCHEMA, value: {{ .Values.database.keycloakSchema | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "sd.applicationSecret" . }}, key: KC_DB_PASSWORD }
          # pg_isready : « la base accepte-t-elle des connexions ? » (-h 127.0.0.1 : le vrai serveur,
          # pas le serveur provisoire du premier démarrage ; -U et -d : notre utilisateur et notre base).
          startupProbe:
            exec: { command: ["sh", "-c", 'pg_isready -q -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["sh", "-c", 'pg_isready -q -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", 'pg_isready -q -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          {{- include "sd.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "sd.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgresql
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.database.storage.className }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.storage.size }}
{{- end }}
