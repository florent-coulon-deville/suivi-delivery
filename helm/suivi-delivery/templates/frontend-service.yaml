{{- /* Adresse interne de l'interface, vers laquelle pointent la Route (OpenShift) ou l'Ingress. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sd.name" . }}-frontend
  labels:
    {{- include "sd.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "sd.selector" (dict "context" . "part" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
