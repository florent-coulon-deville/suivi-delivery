# Réglages de l'analyse automatique SonarCloud (lus à chaque analyse des PR et de main).

# Version de Python du projet : SonarCloud n'a plus à supposer 3.10 à 3.14.
sonar.python.version=3.14

# Code de l'application : tout le dépôt, sauf les tests (un fichier ne peut pas être des deux côtés).
sonar.sources=.
sonar.exclusions=backend/tests/**

# Code de test : jugé avec les règles propres aux tests.
sonar.tests=backend/tests
