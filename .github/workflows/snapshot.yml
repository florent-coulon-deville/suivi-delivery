# Pipeline SNAPSHOT : à chaque push, sur n'importe quelle branche (main comprise).
# Comme un pipeline GitLab, il enchaîne des étapes ; chacune appelle une brique réutilisable
# (fichiers « _*.yml ») :
#
#   1. vérifications, en parallèle : backend (mémoire + PostgreSQL), frontend, chart Helm,
#      version unique — toutes, à chaque push (le cache les rend rapides) ;
#   2. images : seulement si toutes les vérifications sont vertes, les cinq images sont
#      fabriquées (Intel/AMD et ARM) et publiées dans ghcr.io sous UNE étiquette par branche, écrasée
#      à chaque push : on a toujours le dernier état de la branche, pour l'essayer sur un cluster.
#
#        main               →  ghcr.io/<propriétaire>/suivi-delivery-backend:main-snapshot
#        feat/export-excel  →  ghcr.io/<propriétaire>/suivi-delivery-backend:feat-export-excel-snapshot
#
# Une étiquette de snapshot ne ressemble jamais à une version (0.5.0) : les versions sont
# publiées par release.yml, et ne sont jamais écrasées. Le titre des PR est vérifié à part
# (pr-title.yml). Sur le commit de version (« chore: version X.Y.Z », fusion de la PR de
# release-please), tout est sauté : release.yml y refait les vérifications et publie la version.
# Les images écrasées restent stockées sans étiquette : nettoyage à prévoir. Voir docs/ci.md.
name: Snapshot

on:
  push:
    # Toutes les branches, sauf celle de la PR de version (release-please) : rien à essayer.
    branches: ["**", "!release-please--branches--main"]
  # Bouton « Run workflow » (onglet Actions) : snapshot d'une branche choisie, à la demande.
  workflow_dispatch:
    inputs:
      no_cache:
        description: Tout refabriquer, sans cache (images de base retéléchargées)
        type: boolean
        default: false

permissions:
  contents: read

# Deux pushes rapprochés sur la même branche : seul le dernier compte (l'étiquette serait
# écrasée).
concurrency:
  group: snapshot-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Étape 1 : vérifications (en parallèle) -------------------------------------------------
  # Chaque job est sauté sur le commit de version (voir l'en-tête ; bouton « Run workflow » :
  # pas de message de commit, rien n'est sauté). Les images en dépendent : sautées aussi.
  backend:
    name: Backend
    if: "!startsWith(github.event.head_commit.message, 'chore: version ')"
    uses: ./.github/workflows/_tests-backend.yml
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN (images durcies de la base de test et de Liquibase)
  frontend:
    name: Frontend
    if: "!startsWith(github.event.head_commit.message, 'chore: version ')"
    uses: ./.github/workflows/_tests-frontend.yml
  helm:
    name: Chart Helm
    if: "!startsWith(github.event.head_commit.message, 'chore: version ')"
    uses: ./.github/workflows/_tests-helm.yml
  version:
    name: Version
    if: "!startsWith(github.event.head_commit.message, 'chore: version ')"
    uses: ./.github/workflows/_version.yml

  # --- Étape 2 : images, si tout est vert -------------------------------------------------------
  tag:
    name: Étiquette de la branche
    if: "!startsWith(github.event.head_commit.message, 'chore: version ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Nom de la branche passé par une variable d'environnement, jamais écrit dans le script
      # (il pourrait contenir des commandes). Une étiquette Docker n'accepte que lettres,
      # chiffres, « . », « _ », « - » (128 caractères au plus) : le reste devient « - ».
      - name: Étiquette de la branche
        id: tag
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          slug=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^[-.]+//; s/-+$//' | cut -c1-110)
          echo "tag=$slug-snapshot" >> "$GITHUB_OUTPUT"
          echo "Branche $BRANCH → étiquette $slug-snapshot"
  images:
    name: Images
    needs: [backend, frontend, helm, version, tag]
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read
      packages: write  # publier dans ghcr.io
    with:
      tag: ${{ needs.tag.outputs.tag }}
      # Intel/AMD et ARM, comme une release : les snapshots tournent aussi sur un Mac ARM
      # (demande de l'utilisateur). « docker pull » prend tout seul la bonne.
      multiarch: true
      no_cache: ${{ inputs.no_cache == true }}
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN (images de base durcies)
