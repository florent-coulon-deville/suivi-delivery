# Brique réutilisable (appelée par snapshot.yml, jamais lancée seule) : aucun secret dans le
# dépôt. gitleaks (outil libre, image officielle du projet, version figée) relit TOUT
# l'historique Git, pas seulement le dernier commit : un secret ajouté puis effacé reste dans
# l'historique, donc lisible par tous (dépôt public). Voir docs/ci.md § 3.
#
# Complète la détection des secrets de GitHub (Settings → Advanced Security), qui ne reconnaît
# que les jetons des grands fournisseurs : gitleaks repère aussi des formes générales (clés,
# mots de passe dans une adresse…). Secrets masqués dans le journal (--redact).
name: Secrets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Aucun secret dans l'historique (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tout l'historique
          persist-credentials: false
      # Lancé avec l'utilisateur de la machine : Git accepte alors le dossier monté (sinon
      # « dubious ownership »).
      - name: gitleaks v8.30.1
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --no-banner --redact --verbose
