# Pipeline RELEASE : les versions de l'application, à chaque push sur main. Voir docs/ci.md § 5.
#
#   1. release-please (outil de Google) lit les titres des commits depuis la dernière version
#      (Conventional Commits : feat:, fix:…) et ouvre ou met à jour une PR « chore: version X.Y.Z »
#      qui change le numéro partout (release-please-config.json) et complète CHANGELOG.md ;
#      quand on fusionne cette PR, il pose l'étiquette vX.Y.Z et crée la Release GitHub ;
#   2. seulement si une version vient d'être créée :
#        a. version : le numéro est unique, égal à l'étiquette, et pas encore publié
#           (une image publiée ne change jamais) ;
#        b. vérifications, sur le commit de l'étiquette : backend, frontend, chart Helm (une
#           version publiée a forcément été testée) ;
#        c. images : les deux, Intel/AMD + ARM, publiées dans ghcr.io sous <version> (jamais
#           « latest ») ;
#        d. Docker Hub : un seul dépôt pour toute l'application, docker.io/<compte>/suivi-delivery :
#           les mêmes images recopiées sous <partie>-<version>, et le chart Helm (OCI) sous
#           <version>.
# Une étiquette posée avec le jeton GITHUB_TOKEN ne déclenche aucun autre workflow : tout se
# passe donc dans ce pipeline. Publication ratée (panne d'un registre…) : bouton « Run workflow »,
# avec l'étiquette (v0.5.0) : les étapes 2a à 2d reprennent pour elle.
#
# Réglage du dépôt requis : Settings → Actions → General → « Allow GitHub Actions to create and
# approve pull requests ». Actions figées par leur empreinte de commit (version en commentaire).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette de la version à publier (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

# Une seule exécution à la fois, jamais interrompue (elle peut poser une étiquette, publier).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- Étape 1 : release-please -----------------------------------------------------------------
  release-please:
    name: Préparer ou créer la version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # étiquette, Release GitHub, branche de la PR de version
      pull-requests: write  # PR de version
      issues: write         # étiquettes (labels) de la PR de version
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --- Étape 2a : la version à publier ------------------------------------------------------------
  check:
    name: Vérifier la version
    needs: release-please
    # Une version vient d'être créée, ou relance à la main (release-please alors sauté).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read  # pour savoir si la version est déjà publiée
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Version unique, égale à l'étiquette
        id: version
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          python3 cicd/check_versions.py
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "::error::L'étiquette $TAG ne correspond pas à la version de l'application ($VERSION)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Version pas encore publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for part in backend frontend; do
            if docker manifest inspect "$registry/suivi-delivery-$part:$VERSION" > /dev/null 2>&1; then
              echo "::error::$registry/suivi-delivery-$part:$VERSION est déjà publiée : changer de version (une image publiée ne change jamais)."
              exit 1
            fi
          done
          echo "Version $VERSION : pas encore publiée"

  # --- Étape 2b : vérifications, sur le commit de l'étiquette (en parallèle) --------------------
  backend:
    name: Backend
    needs: check
    uses: ./.github/workflows/_tests-backend.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN
  frontend:
    name: Frontend
    needs: check
    uses: ./.github/workflows/_tests-frontend.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
  helm:
    name: Chart Helm
    needs: check
    uses: ./.github/workflows/_tests-helm.yml
    with:
      ref: ${{ needs.check.outputs.tag }}

  # --- Étape 2c : images de la version, si tout est vert -------------------------------------------
  images:
    name: Images
    needs: [check, backend, frontend, helm]
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read
      packages: write  # publier dans ghcr.io
      security-events: write  # rapports Docker Scout dans l'onglet Security
    with:
      ref: ${{ needs.check.outputs.tag }}
      tag: ${{ needs.check.outputs.version }}
      multiarch: true
      pull: true  # images de base à jour (correctifs de sécurité)
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN

  # --- Étape 2d : Docker Hub (images recopiées, chart Helm) ----------------------------------------
  # UN SEUL dépôt Docker Hub pour toute l'application (choix de l'utilisateur : une application,
  # plusieurs images ; l'offre gratuite de Docker Scout suit un seul dépôt) :
  #   <compte>/suivi-delivery:<version>            le chart Helm (Helm lui donne ce nom)
  #   <compte>/suivi-delivery:backend-<version>    les images : la partie, puis la version
  # Les images sont recopiées depuis ghcr.io (publiques), avec leurs deux processeurs : rien n'est
  # refabriqué, ce sont exactement les mêmes. Le chart est publié en OCI : il s'installe avec
  #   helm install suivi-delivery oci://registry-1.docker.io/<compte>/suivi-delivery --version X.Y.Z
  # Compte et jeton : le compte Docker du dépôt (DHI_USERNAME, DHI_TOKEN ; le jeton doit avoir le droit
  # d'écrire, « Read, Write, Delete »). Connexions faites par Docker et Helm eux-mêmes, le jeton
  # passé par l'entrée standard. helm : celui installé par GitHub sur ses machines.
  dockerhub:
    name: Docker Hub (images et chart)
    needs: [check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - name: Connexion à Docker Hub
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          echo "$DHI_TOKEN" | docker login docker.io --username "$DHI_USERNAME" --password-stdin
          echo "$DHI_TOKEN" | helm registry login registry-1.docker.io --username "$DHI_USERNAME" --password-stdin
      - name: Recopier les deux images (amd64 + arm64)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          source="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          target="docker.io/${DHI_USERNAME,,}"
          for part in backend frontend; do
            docker buildx imagetools create --tag "$target/suivi-delivery:$part-$VERSION" "$source/suivi-delivery-$part:$VERSION"
            echo "$target/suivi-delivery:$part-$VERSION"
          done
      - name: Publier le chart Helm (OCI)
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
        run: |
          helm version --short
          helm package helm/suivi-delivery --destination /tmp/chart
          helm push /tmp/chart/suivi-delivery-*.tgz "oci://registry-1.docker.io/${DHI_USERNAME,,}"
