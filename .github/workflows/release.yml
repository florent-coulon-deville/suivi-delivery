# Pipeline RELEASE : les versions de l'application, à chaque push sur main. Voir docs/ci.md § 5.
#
#   1. release-please (outil de Google) lit les titres des commits depuis la dernière version
#      (Conventional Commits : feat:, fix:…) et ouvre ou met à jour une PR « chore: version X.Y.Z »
#      qui change le numéro partout (release-please-config.json) et complète CHANGELOG.md ;
#      quand on fusionne cette PR, il pose l'étiquette vX.Y.Z et crée la Release GitHub ;
#   2. seulement si une version vient d'être créée :
#        a. version : le numéro est unique, égal à l'étiquette, et pas encore publié
#           (une image publiée ne change jamais) ;
#        b. vérifications, sur le commit de l'étiquette : backend, frontend, chart Helm (une
#           version publiée a forcément été testée) ;
#        c. images : les cinq, Intel/AMD + ARM, publiées dans ghcr.io sous <version> (jamais
#           « latest »).
# Une étiquette posée avec le jeton GITHUB_TOKEN ne déclenche aucun autre workflow : tout se
# passe donc dans ce pipeline. Publication ratée (panne de dhi.io…) : bouton « Run workflow »,
# avec l'étiquette (v0.5.0) : les étapes 2a à 2c reprennent pour elle.
#
# Réglage du dépôt requis : Settings → Actions → General → « Allow GitHub Actions to create and
# approve pull requests ». Actions figées par leur empreinte de commit (version en commentaire).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Étiquette de la version à publier (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

# Une seule exécution à la fois, jamais interrompue (elle peut poser une étiquette, publier).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # --- Étape 1 : release-please -----------------------------------------------------------------
  release-please:
    name: Préparer ou créer la version
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # étiquette, Release GitHub, branche de la PR de version
      pull-requests: write  # PR de version
      issues: write         # étiquettes (labels) de la PR de version
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # --- Étape 2a : la version à publier ------------------------------------------------------------
  check:
    name: Vérifier la version
    needs: release-please
    # Une version vient d'être créée, ou relance à la main (release-please alors sauté).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read  # pour savoir si la version est déjà publiée
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Version unique, égale à l'étiquette
        id: version
        env:
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: |
          python3 cicd/check_versions.py
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "::error::L'étiquette $TAG ne correspond pas à la version de l'application ($VERSION)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Version pas encore publiée
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for part in backend frontend liquibase keycloak postgres; do
            if docker manifest inspect "$registry/suivi-delivery-$part:$VERSION" > /dev/null 2>&1; then
              echo "::error::$registry/suivi-delivery-$part:$VERSION est déjà publiée : changer de version (une image publiée ne change jamais)."
              exit 1
            fi
          done
          echo "Version $VERSION : pas encore publiée"

  # --- Étape 2b : vérifications, sur le commit de l'étiquette (en parallèle) --------------------
  backend:
    name: Backend
    needs: check
    uses: ./.github/workflows/_tests-backend.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN
  frontend:
    name: Frontend
    needs: check
    uses: ./.github/workflows/_tests-frontend.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
  helm:
    name: Chart Helm
    needs: check
    uses: ./.github/workflows/_tests-helm.yml
    with:
      ref: ${{ needs.check.outputs.tag }}

  # --- Étape 2c : images de la version, si tout est vert -------------------------------------------
  images:
    name: Images
    needs: [check, backend, frontend, helm]
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read
      packages: write  # publier dans ghcr.io
    with:
      ref: ${{ needs.check.outputs.tag }}
      tag: ${{ needs.check.outputs.version }}
      multiarch: true
      pull: true  # images de base à jour (correctifs de sécurité)
    secrets: inherit  # DHI_USERNAME, DHI_TOKEN
