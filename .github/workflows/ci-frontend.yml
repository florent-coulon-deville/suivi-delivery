# CI du frontend (interface Next.js) : types TypeScript et construction du site.
# Mêmes contrôles que sur le poste (npm run typecheck, npm run build). Rien n'est déployé.
#
# Actions figées par leur empreinte de commit (version en commentaire). Voir docs/ci.md.
name: CI frontend

on:
  pull_request:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ci-frontend.yml"]

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types et construction)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "26"  # comme l'image Docker dhi.io/node:26.12.1-alpine3.24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances (sans exécuter leurs scripts)
        run: npm ci --ignore-scripts
      - name: Types (TypeScript)
        run: npm run typecheck
      - name: Construction (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
