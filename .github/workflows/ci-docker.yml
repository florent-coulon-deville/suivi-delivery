# CI des images Docker : construit les images du backend, du frontend, de Liquibase, de Keycloak et de PostgreSQL,
# SANS les publier,
# pour repérer tout de suite un Dockerfile cassé. Rien n'est déployé.
#
# Actions figées par leur empreinte de commit (version en commentaire). Voir docs/ci.md.
name: CI images Docker

on:
  pull_request:
    branches: [main]
    paths: ["backend/**", "frontend/**", "liquibase/**", "keycloak/**", "postgres/**", ".github/workflows/ci-docker.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "liquibase/**", "keycloak/**", "postgres/**", ".github/workflows/ci-docker.yml"]

permissions:
  contents: read

concurrency:
  group: ci-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image ${{ matrix.part }} (construction, sans publication)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false  # une image cassée n'arrête pas la vérification des autres
      matrix:
        include:
          - { part: backend, context: backend }
          - { part: frontend, context: frontend }
          - { part: liquibase, context: liquibase }  # structure de la base
          - { part: keycloak, context: keycloak }  # comptes et connexion (thème, domaine importé)
          - { part: postgres, context: postgres }  # base de données (image officielle, au nom du projet)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Chaque Dockerfile récupère lui-même ce dont il a besoin (dépendances, site construit,
      # connecteur PostgreSQL) : rien à préparer avant la construction.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Images de base durcies (Docker Hardened Images, dhi.io) : connexion avec un compte Docker,
      # faite par Docker lui-même (le jeton n'est confié à aucune action tierce).
      - name: Connexion à dhi.io
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        # Jusqu'à 5 essais, pause de 30 s, 60 s, 90 s, 120 s entre deux : une coupure passagère
        # de dhi.io (vue le 2026-10-23 depuis les machines GitHub) ne fait plus échouer la CI.
        # Avant chaque essai, on vérifie que dhi.io répond (401 attendu : il demande une
        # connexion) : le journal distingue ainsi « dhi.io injoignable » de « jeton refusé ».
        run: |
          for attempt in 1 2 3 4 5; do
            answer=$(curl -s -o /dev/null --max-time 20 -w '%{http_code} en %{time_total} s' https://dhi.io/v2/ || true)
            if [[ $answer == 401* ]]; then
              echo "dhi.io répond ($answer)."
            else
              echo "::warning::dhi.io ne répond pas normalement (réponse : ${answer:-aucune})."
            fi
            if echo "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin; then
              exit 0
            fi
            if [[ $attempt -lt 5 ]]; then
              echo "::warning::Connexion à dhi.io ratée (essai $attempt sur 5), nouvel essai dans $((attempt * 30)) s."
              sleep $((attempt * 30))
            fi
          done
          echo "::error::dhi.io ne répond pas après 5 essais : réessayer plus tard (Re-run failed jobs)."
          exit 1
      - name: Construire l'image ${{ matrix.part }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false  # vérifier seulement : rien n'est publié
          cache-from: type=gha,scope=${{ matrix.part }}
          cache-to: type=gha,scope=${{ matrix.part }},mode=max
