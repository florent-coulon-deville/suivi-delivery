# CI des messages de commit : chaque commit d'une PR doit suivre Conventional Commits
# (« feat: … », « fix(api): … »). Les PR sont fusionnées avec un commit de fusion (docs/git.md) :
# release-please lit donc chacun de ces commits pour en déduire la prochaine version
# (release.yml). Voir docs/git.md et docs/ci.md § 5.
#
# Vérifié dans le shell, sans action tierce. Les commits de fusion (« Merge branch 'main'… ») sont
# ignorés : release-please les ignore aussi.
name: CI messages de commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Messages de commit (Conventional Commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # tout l'historique, pour lister les commits de la PR
          persist-credentials: false
      # Empreintes passées par des variables d'environnement, jamais écrites dans le script.
      - name: Vérifier les messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|revert|docs|refactor|test|build|ci|chore|style)(\([a-z0-9-]+\))?!?: .+'
          refused=0
          while IFS= read -r line; do
            subject="${line#* }"
            if [[ "$subject" =~ $pattern ]]; then
              echo "ok   $line"
            else
              echo "::error::Message refusé : « $subject » (commit ${line%% *})"
              refused=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          if [[ $refused == 1 ]]; then
            echo "Chaque message doit commencer par un type suivi de « : »."
            echo "Exemples : « feat: export Excel », « fix(frontend): menu Saisie », « feat!: … » si l'existant casse."
            echo "Types : feat (nouveauté), fix (correction), perf, revert, docs, refactor, test, build, ci, chore, style."
            echo "Corriger : git rebase -i origin/main (reword), puis git push --force-with-lease. Voir docs/git.md."
            exit 1
          fi
